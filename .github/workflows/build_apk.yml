name: Build Android APK

on:
  workflow_dispatch: # Ti permette di avviarlo con un bottone quando vuoi tu!

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice della repo
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configura Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7

      - name: Diagnostica wrapper Gradle
        run: |
          echo "=== CONTENUTO ANDROID ==="
          ls -la android/
          echo "=== FILE WRAPPER ==="
          find android/gradle -maxdepth 3 -type f -print
          echo "=== FILE GRADLE NEL REPOSITORY ==="
          find . -maxdepth 3 -name "gradlew*" -print

      - name: Installa i pacchetti (pub get)
        run: flutter pub get

      - name: Genera APK Release
        run: flutter build apk --release

      - name: Diagnostica regole R8
        if: always()
        run: |
          echo "=== REGOLE R8 MANCANTI ==="
          find build -name missing_rules.txt -print
          if [ -f build/app/outputs/mapping/release/missing_rules.txt ]; then
            cat build/app/outputs/mapping/release/missing_rules.txt
          fi

      - name: Carica APK pronto per il download
        uses: actions/upload-artifact@v4
        with:
          name: Football-Steph-APK
          path: build/app/outputs/flutter-apk/app-release.apk
